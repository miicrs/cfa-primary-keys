<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Bao, Ezri, Carmen, Matyana">
  <link rel="stylesheet" href="../css/bank-selection.css">
  <link rel="icon" type="image/png" href="../Images/cents.png">
  <title>Making Cents Select Your Bank</title>

<body>
    <!-- Making Cents Logo -->
    <!-- Layout from Bootstrap Heroes example package -->
    <div class="logo">
        <div class="logo-icon">
            <img 
                src="../Images/cents.png"
                alt="Making cents logo containing black circle with cent symbol"
                width="175"
                height="175"
            />
        </div>

        <!-- Making Cents Logo Text -->
        <div class="logo-text">
            <h1>Making Cents</h1>
        </div>
    </div>

    <!-- Where do you bank question -->
    <div class="logo-question">
        <h2>Where do you bank?</h2>
    </div>

    <!-- Search by institution bar -->
    <div class="search-bar">
        <!-- Icon image from hqrloveq on flaticon.com -->
        <img 
            src="../Images/glass.png"
            alt="Search icon"
            width="40"
            height="40"
        />

        <input type="text" placeholder="Search by institution" class="search-input">

        <!-- Icon image from Kiranshastry on flaticon.com -->
        <img 
            src="../Images/microphone.png"
            alt="Microphone icon"
            width="25"
            height="25"
        />
    </div>

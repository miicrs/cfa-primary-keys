<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Bao, Ezri, Carmen, Matyana">
  <link rel="stylesheet" href="../css/goals.css">
</head>

<body>
    <!-- Making Cents Logo -->
    <!-- Layout from Bootstrap Heroes example package -->
    <div class="logo">
        <div class="logo-icon">
            <img 
                src="../Images/cents.png"
                alt="Making cents logo containing black circle with cent symbol"
                width="175"
                height="175"
            />
        </div>

        <!-- Making Cents Logo Text -->
        <div class="logo-text">
            <h1>Making Cents</h1>
        </div>
    </div>

    <!-- Where do you bank question -->
    <div class="logo-question">
        <h2>What are your financial focuses and goals right now?</h2>
    </div>

    <!-- Search by institution bar -->
    <div class="search-bar">
        <!-- Icon image from hqrloveq on flaticon.com -->
        <img 
            src="../Images/glass.png"
            alt="Search icon"
            width="40"
            height="40"
        />

        <input type="text" placeholder="Search" class="search-input">

        <!-- Icon image from Kiranshastry on flaticon.com -->
        <img 
            src="../Images/microphone.png"
            alt="Microphone icon"
            width="25"
            height="25"
        />
    </div>

    <div class="goals-selection">
        <div class="goals-card">
            <p class="goal-type">Saving money</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Investing</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Understanding credit</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Paying off loans / debts</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Retirement</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Asset protection</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Credit score</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Tracking your spending</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Building credit</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Investment portfolio</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Taxes</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Emergency funds</p>
        </div>

        <div class="goals-card">
            <p class="goal-type">Other</p>
        </div>
    </div>

    <!-- Next button -->
    <div class="button">
        <a href="sign-up.html" class="next-btn" type="button">
            <span>Next</span>
            <span class="arrow">→</span>
        </a>
    </div>

    <script src="../JavaScript/goals.js"></script>

</body>

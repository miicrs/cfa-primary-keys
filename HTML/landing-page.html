<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Bao, Ezri, Carmen, Matyana">
  <link rel="stylesheet" href="../css/landing-page.css">
  <link rel="icon" type="image/png" href="/Images/cents.png">
  <title>Making Cents Landing Page</title>
</head>


<body>
    <!-- Making Cents Logo -->
    <!-- Layout from Bootstrap Heroes example package -->
     <div class="logo-container">
        <img 
            src="/Images/cents.png"
            alt="Making cents logo containing black circle with cent symbol"
            width="250"
            height="250"
        />
     </div>

    <!-- Greeting --> 
    <div class="heading">
        <h1>Welcome to Making Cents!</h1>
        <p class="description">
            We are glad that you are taking the first step to financial literacy. <br>
            To get started, please login or sign up for an account below:
        </p>
    </div>

    <!-- Login & Sign Up -->
    <div class="button">
        <!-- Login button -->
        <a href="login.html" class="login-btn" type="button">
            <span>Login</span>
            <span class="arrow">→</span>
        </a>

        <!-- Divider #1: Other login options (SSO) -->
        <div class="divider">
            <span>Or login with:</span>
        </div>

        <!-- Google & Outlook SSO options-->
        <!-- Icon images from icons8.com -->
        <div class="sso">
            <a href="index.html" class="google-login-btn" type="button">
                <img src="../Images/icons8-google-48.png" class="sso-icons" alt="Google logo">
                <span>Google</span>
                <span class="arrow">→</span>
            </a>
        
            <a href="index.html" class="outlook-login-btn" type="button">
                <img src="../Images/icons8-outlook-48.png" class="sso-icons" alt="Outlook logo"/>
                <span>Outlook</span>
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- Divider #2: Sign up option -->
        <div class="divider">
            <span>Or sign up:</span>
        </div>

        <!-- Sign Up button -->
        <a href="sign-up.html" class="signup-btn" type="button">
            <span>Sign Up</span>
            <span class="arrow">→</span>
        </a>
    </div>
</body>

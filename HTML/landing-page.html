<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Bao, Ezri, Carmen, Matyana">
  <link rel="stylesheet" href="../css/landing-page.css">
</head>


<body>
    <!-- Greeting --> 
    <div class="heading">
        <h1>Welcome to Making Cents!</h1>
        <p class="description">
            We are glad that you are taking the first step to financial literacy. <br>
            To get started, please login or sign up for an account below:
        </p>
    </div>

    <!-- Login & Sign Up -->
    <div class="login">
        <!-- Login button -->
        <button class="login-btn" type="button">
            <span>Login</span>
            <span class="arrow">→</span>
        </button>

        <!-- Divider #1: Other login options (SSO) -->
        <div class="divider">
            <span>Or login with:</span>
        </div>

        <!-- Google & Outlook SSO options-->
        <div class="sso">
            <button class="google-login-btn" type="button">
                <span>Google</span>
                <span class="arrow">→</span>
            </button>
        
            <button class="outlook-login-btn" type="button">
                <span>Outlook</span>
                <span class="arrow">→</span>
            </button>
        </div>

        <!-- Divider #2: Sign up option -->
        <div class="divider">
            <span>Or sign up:</span>
        </div>

        <!-- Sign Up button -->
        <button class="signup-btn" type="button">
            <span>Sign Up</span>
            <span class="arrow">→</span>
        </button>
    </div>
</body>
